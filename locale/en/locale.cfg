mythos-1=Grants an extra mythos floor to more efficiently utilize the land area.\n__CONTROL__mythos-rotate__ to toggle port markers (requires ALT-mode).\n__CONTROL__mythos-open-outside-surface-to-remote-view__ to open the mythos floor in remote view.\n__CONTROL__cut__ to move the mythos building from remote view.
mythos-2=Grants an extra mythos floor to more efficiently utilize the land area.\n__CONTROL__mythos-rotate__ to toggle port markers (requires ALT-mode).\n__CONTROL__mythos-open-outside-surface-to-remote-view__ to open the mythos floor in remote view.\n__CONTROL__cut__ to move the mythos building from remote view.
mythos-3=Grants an extra mythos floor to more efficiently utilize the land area.\n__CONTROL__mythos-rotate__ to toggle port markers (requires ALT-mode).\n__CONTROL__mythos-open-outside-surface-to-remote-view__ to open the mythos floor in remote view.\n__CONTROL__cut__ to move the mythos building from remote view.

