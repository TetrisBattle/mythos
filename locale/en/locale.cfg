[command-help-message]
mythos-give-lost-mythos-buildings=Gives you all picked-up mythos buildings in item form, except those already in your player inventory. Using this command if the mythos building items aren't actually gone may cause multiple items in your world to refer to the same mythos building. These extra items will vanish with an "Invalid mythos data!" message when placed.
