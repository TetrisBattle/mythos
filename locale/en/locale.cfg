[technology-description]
mythos-upgrade-greenhouse=Install translucent roofing into the mythos ceiling. Plant overgrowth soil inside mythos buildings and grow crops using the [entity=agricultural-tower]. Allows [entity=solar-panel] to be used with half efficiency inside the mythos.
mythos-upgrade-borehole-pump=Extract fluids from buried aquifers using borehole pumps. Extracted fluid depends on the planet. Must be placed inside a mythos building.
mythos-connection-type-fluid=Transport fluids through your mythos building using pipes and underground pipes.\nHover over the connection arrow and press __CONTROL__mythos-rotate__ to choose between input or output mode. __CONTROL__mythos-increase__ and __CONTROL__mythos-decrease__ to change the update rate.
mythos-connection-type-chest=Transport items through your mythos building using chests.\nHover over the connection arrow and press __CONTROL__mythos-rotate__ to choose between input, output or [font=default-semibold][color=255,230,192]Transfer mode[/color][/font]. __CONTROL__mythos-increase__ and __CONTROL__mythos-decrease__ to change the update rate.
mythos-connection-type-circuit=Transport circuit signals through your mythos building using the mythos circuit connector.
mythos-interior-upgrade-lights=Adds ceiling lights to all your factories. View a preview of the mythos building by hovering the mouse.
mythos-interior-upgrade-display=Adds an alt-view display to your factories. Put items in the overlay controllers inside your mythos to determine what is shown on the outside.
mythos-recursion-t1=Nest mythos buildings inside other, larger mythos buildings.
mythos-recursion-t2=Nest any mythos building inside any other mythos building.
mythos-connection-type-heat=Transport heat through your mythos building using heat pipes.\n__CONTROL__mythos-increase__ and __CONTROL__mythos-decrease__ to change the update rate.
mythos-interior-upgrade-roboport=Send construction requests to the outside surface. Construction robots will deliver the requested items to the construction chest inside the mythos.
mythos-space-architecture=Advanced space manufacturing technologies allows construction of mythos buildings in space.

