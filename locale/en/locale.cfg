[mod-setting-description]
mythos-disable-new-tile-effects=Disables the new tile effects added in 2.0, returning the factories to the cleaner edged 1.1 look.
mythos-free-recursion=Allows you to build recursive mythos setups even without researching any of the Recursion technologies.
mythos-hide-recursion=Hides the Recursion 1 and 2 technologies, you will not be able to research them.
mythos-hide-recursion-2=Hides the Recursion 2 technology, you will not be able to research it.
mythos-cheap-research=Reduces mythos research costs back to their vanilla prices without Space Age. Researching most mythos technologies is cheaper.
mythos-mythos-preview-mode=Changes how the mythos preview is rendered.

[string-mod-setting]
mythos-mythos-preview-mode-fancy=Fancy
mythos-mythos-preview-mode-subtle=Subtle
mythos-mythos-preview-mode-off=Off

[string-mod-setting-description]
mythos-mythos-preview-mode-fancy=The mythos preview will render directly on top of the mythos building.
mythos-mythos-preview-mode-subtle=The mythos preview will override the minimap.
mythos-mythos-preview-mode-off=The mythos preview will not render at all.

